const RESEARCH=[
  ['Pehla ilaaj: parents ki training','4–6 saal ke ADHD bacchon ke liye American Academy of Pediatrics ka pehla sujhaav behaviour management mein parent training hai, aur school mein classroom behaviour support.','App aapke saath khelne ke liye bana hai. Har scene ke baad aapke liye tip aur asli jagah ka mission milta hai.','https://eqipp.aap.org/courses/adhd/mn/clinical-guide/popups/key-action-statement-5a','AAP ADHD guideline (KAS 5a)'],
  ['Poora sentence dohraana (recast)','Bacche ki baat ko sahi, poore sentence mein dohraane (recast) par 35 studies ka review: language mein lagbhag 0.75–1 SD ka fayda.','Har jawab ke baad poora sentence dikhta aur bola jaata hai. Shivansh use zor se dohraata hai.','https://pubs.asha.org/doi/abs/10.1044/2015_AJSLP-14-0105','Cleave et al. 2015, AJSLP'],
  ['Dost ke saath khel se baat-cheet','ADHD bacchon (5–11 saal) mein dost ke saath play-based sessions ke baad pragmatic language (baari, topic par rehna) behtar hui.','Aarav aur Chintu ke saath baari-baari baat, sawaal poochna, wait karna.','https://acuresearchbank.acu.edu.au/item/8v41y/the-pragmatic-language-abilities-of-children-with-adhd-following-a-play-based-intervention-involving-peer-to-peer-interactions','Cordier et al. 2013'],
  ['Pehle dekho, phir karo (video modelling)','ADHD bacchon par 15 studies ka review: video modelling social skills ke liye "promising" hai, khaas kar doosre tareekon ke saath.','Har jagah ka pehla level "👀 Dekho": Shivansh khud sahi tareeke se karta dikhta hai (self-modelling jaisa).','https://researchportal.northumbria.ac.uk/en/publications/a-systematic-review-of-videomodelling-interventions-for-children-/','Northumbria systematic review'],
  ['Pehle se kahani (social story)','Preschool bacchon mein social stories se expected behaviour seekhne mein madad milti hai (systematic review aur meta-analysis).','"📖 Kahani" – asli jagah jaane se pehle, Shivansh ki awaaz mein step-by-step.','https://pmc.ncbi.nlm.nih.gov/articles/PMC11277040','Social story meta-analysis, preschool'],
  ['Daily report card','213 ADHD bacchon par RCT (2025): roz specific goals par teacher feedback aur ghar par chhota inaam dene se class behaviour behtar hua.','"📋 Report card" – 3 goals, roz shaam ko.','https://www.simplypsychology.org/?p=87610','Fabiano et al. 2025 (summary)'],
  ['Jab tak sahi na ho, madad badhao (prompting)','"System of least prompts" aur "time delay" prompting ko evidence-based practice maana gaya hai: pehle khud karne ka mauka, phir thoda-thoda zyada hint.','Jaadui Kamra: galti par kabhi "galat" nahi. Pehle instruction dohraana → cheez chamakna → teer (arrow) → cheez aadhe raaste tak khud chalna. Kaam tab tak chalta hai jab tak Shivansh sahi na kar le.','https://afirm.fpg.unc.edu/wp-content/uploads/Prompting-Brief-Packet-Sam-AFIRM-Team-Updated-2024.pdf','AFIRM (UNC): Prompting brief'],
  ['Games akele ilaaj nahi','Game-based digital therapy ka asar control se thoda behtar (chhota effect) mila. Ek 2026 study mein 4 hafte ke game training ka koi khaas fayda nahi dikha.','Games sirf 2–3 minute ke hain aur roz ki screen limit hai. Asli practice aapke saath aur asli jagah par hoti hai.','https://www.adhdevidence.org/blog/two-new-meta-analyses-evaluate-digital-interventions-for-treating-adhd','ADHD Evidence: 2 meta-analyses'],
  ['Madad dheere-dheere kam karna','Shadow ya adult support achanak nahi, step-by-step aur plan ke saath kam karna chahiye.','"🏫 Shadow plan" aur app ke 3 level (👀 → 🤝 → ⭐): madad har level par kam hoti hai.','https://www.sonderly.io/en-ca/articles_/t23392/s22401-pulling-back--a-4-step-process-for-gradually-fading-support','Fading support: 4 steps'],
  ['India mein kitna aam hai','19 Indian studies ka meta-analysis: lagbhag 6.3% bacchon mein ADHD (school-based studies mein 7.5%). Shivansh akela nahi hai.','—','https://link.springer.com/article/10.1007/s12098-021-03999-9','Chauhan et al., Indian J Pediatr']];
function pResearch(){
  $('#pv').innerHTML=`<div class="card"><h3>Ye app kis research par bana hai</h3><p class="muted small">Ye app ilaaj ki jagah nahi hai. Ye ghar par practice ka saathi hai. Diagnosis aur plan ke liye developmental pediatrician ya child psychiatrist se milein. Kam kharch mein: sarkari DEIC (RBSK) aur medical college ke OPD.</p>
  ${RESEARCH.map(([h,f,a,u,s])=>`<div class="rs"><b>${h}</b><span>${f}</span><span class="inapp">📱 App mein: ${a}</span><a href="${u}" target="_blank" rel="noopener">${s} ↗</a></div>`).join('')}</div>`;

function pAdvice(){
  $('#pv').innerHTML=`<div class="card"><h3>Is hafte ka plan · AI salah</h3><p class="muted">Pichhle 14 din ka data, report card aur shadow step padh kar ek simple plan banega.</p>
  <button class="btn" id="ab" ${SAMPLE?'':'disabled'}>Plan banao</button>${SAMPLE?'':'<p class="muted small">Ye feature claude.ai mein sign-in karke kholne par chalta hai.</p>'}<div class="advice" id="ao"></div>
  <p class="note small">Ye salah doctor ya therapist ki jagah nahi hai.</p></div>`;
  if(!SAMPLE)return;
  $('#ab').onclick=async()=>{
    const days=lastDays(14),inR=LOGS.filter(l=>days.includes(l.day)),ao=$('#ao');$('#ab').disabled=true;ao.innerHTML='<div class="thinking"><i></i><i></i><i></i></div>';
    const data={activeDays:new Set(inR.map(l=>l.day)).size,sentencesSaid:inR.reduce((s,l)=>s+((l.d||{}).said||0),0),places:Object.fromEntries(MAP_ORDER.map(k=>[k,lvOf(k)])),games:inR.filter(l=>!['scene','chat','story','report'].includes(l.act)).map(l=>({g:l.act,s:l.stars,d:l.d})).slice(0,20),reportCards:Object.fromEntries(days.filter(d=>(PROG.reports||{})[d]).map(d=>[d,PROG.reports[d]])),targets:PROFILE.targets,shadowStep:PROFILE.shadowStage,skillLevels:Object.fromEntries(Object.keys(DOMS).map(k=>[k,domState(k).lv])),room3d:inR.filter(l=>l.act==='magic').map(l=>l.d)};
    const prompt=`You support Indian parents of ${kidName()}, ${PROFILE.age} years, UKG with a shadow teacher, signs of ADHD, short attention, good memory, early language, talks mostly about own interests (${(PROFILE.interests||[]).join(', ')||'not given'}), cannot keep a conversation going. They cannot afford expensive therapy. Ground advice in evidence: behavioural parent training first line (AAP), recasts/expansions, peer play for pragmatic language, modelling, social stories, daily report card with home rewards, systematic fading of shadow support; games are only a small add-on.
Data (app, last 14 days): ${JSON.stringify(data)}. Report card values: 0=😐,1=🙂,2=😀 per target. skillLevels are 1-5 for bhasha(language), samajh(understanding), seekhna(concepts), dosti(social), dhyaan(attention); room3d lists 3D sessions with how many tasks he did fully independently. Shadow steps: 1 sits next to him, 2 sits behind with gestures, 3 from the corner only at transitions, 4 only check-ins.
Write in simple everyday Hinglish (Roman), warm, practical, under 300 words. Headings with "## ": "Kya accha ho raha hai", "Is hafte ke 2 goals", "Roz 10 minute ghar par" (3-4 concrete play activities using his interests, no screens), "Shadow teacher ke liye" (whether to stay or move to the next step and exactly what to change), "Kab expert se milein". If data is thin, say so and give a starter plan. Use "- " bullets. No diagnosis.`;
    try{let out='';await SAMPLE(prompt,{modelTier:'default',cache:false,onText:({text})=>{out=text;ao.innerHTML=md(out)}});ao.innerHTML=md(out)}
    catch(e){ao.innerHTML=`<p class="muted">${e&&e.code==='not_granted'?'AI ki permission nahi mili. Page ke Permissions menu se allow kar sakte hain.':e&&e.code==='rate_limited'?'Abhi bahut requests ho gayi. Thodi der baad try karein.':'Plan nahi ban paaya. Thodi der baad try karein.'}</p>`}
    $('#ab').disabled=false;
  };
}
function md(t){const L=esc(t).split('\n');let h='',ul=false;for(const l of L){const s=l.trim();if(/^[-*] /.test(s)){if(!ul){h+='<ul>';ul=true}h+='<li>'+s.slice(2).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</li>';continue}if(ul){h+='</ul>';ul=false}if(/^#{1,3} /.test(s))h+='<h3>'+s.replace(/^#+ /,'')+'</h3>';else if(s)h+='<p>'+s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>'}if(ul)h+='</ul>';return h}

    $('#mt').onclick=()=>{if(!SR){$('#mtr').textContent='Is browser mein mic se sunna nahi chalta. Android par Google Chrome use karein.';return}PROFILE.recLang=$('#vr').value;PROFILE.mic=true;$('#mtr').textContent='🎤 Kuch boliye… (jaise: Kaka, mujhe chocolate chahiye)';startRec(t=>{$('#mtr').textContent='Sun raha hoon: '+t},f=>{$('#mtr').textContent=f?'Suna: "'+f.text+'" ✓':'Kuch sunai nahi diya. Chrome mein mic ki permission check karein.'})}}
