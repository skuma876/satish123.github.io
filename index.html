  $('#pv').innerHTML=`<div class="card"><h3>Ye app kis research par bana hai</h3><p class="muted small">Ye app ilaaj ki jagah nahi hai. Ye ghar par practice ka saathi hai. Diagnosis aur plan ke liye developmental pediatrician ya child psychiatrist se milein. Kam kharch mein: sarkari DEIC (RBSK) aur medical college ke OPD.</p>
  ${RESEARCH.map(([h,f,a,u,s])=>`<div class="rs"><b>${h}</b><span>${f}</span><span class="inapp">📱 App mein: ${a}</span><a href="${u}" target="_blank" rel="noopener">${s} ↗</a></div>`).join('')}</div>`;
}
function pAdvice(){
  $('#pv').innerHTML=`<div class="card"><h3>Is hafte ka plan · AI salah</h3><p class="muted">Pichhle 14 din ka data, report card aur shadow step padh kar ek simple plan banega.</p>
  <button class="btn" id="ab" ${SAMPLE?'':'disabled'}>Plan banao</button>${SAMPLE?'':'<p class="muted small">Iske liye Setup mein AI key jodein (free).</p>'}<div class="advice" id="ao"></div>
  <p class="note small">Ye salah doctor ya therapist ki jagah nahi hai.</p></div>`;
  if(!SAMPLE)return;
  $('#ab').onclick=async()=>{
    const days=lastDays(14),inR=LOGS.filter(l=>days.includes(l.day)),ao=$('#ao');$('#ab').disabled=true;ao.innerHTML='<div class="thinking"><i></i><i></i><i></i></div>';
    const data={activeDays:new Set(inR.map(l=>l.day)).size,sentencesSaid:inR.reduce((s,l)=>s+((l.d||{}).said||0),0),places:Object.fromEntries(MAP_ORDER.map(k=>[k,placeStars(k)])),games:inR.filter(l=>!['scene','chat','story','report'].includes(l.act)).map(l=>({g:l.act,s:l.stars,d:l.d})).slice(0,20),reportCards:Object.fromEntries(days.filter(d=>(PROG.reports||{})[d]).map(d=>[d,PROG.reports[d]])),targets:PROFILE.targets,shadowStep:PROFILE.shadowStage,skillLevels:Object.fromEntries(Object.keys(RDOM).map(k=>[k,rState(k).lv])),room:inR.filter(l=>l.act==='room').map(l=>l.d)};
    const prompt=`You support Indian parents of ${kidName()}, ${PROFILE.age} years, UKG with a shadow teacher, signs of ADHD, short attention, good memory, early language, talks mostly about own interests (${(PROFILE.interests||[]).join(', ')||'not given'}), cannot keep a conversation going. They cannot afford expensive therapy. Ground advice in evidence: behavioural parent training first line (AAP), recasts/expansions, peer play for pragmatic language, modelling, social stories, daily report card with home rewards, systematic fading of shadow support; games are only a small add-on.
Data (app, last 14 days): ${JSON.stringify(data)}. Report card values: 0=😐,1=🙂,2=😀 per target. skillLevels are 1-5 for talk(language), understand, learn(concepts), friends(social), focus(attention); room lists Magic Room sessions with how many tasks he did fully independently. Places are 0-3 stars. The app speaks simple English and he answers by voice. Shadow steps: 1 sits next to him, 2 sits behind with gestures, 3 from the corner only at transitions, 4 only check-ins.
Write in simple everyday Hinglish (Roman), warm, practical, under 300 words. Headings with "## ": "Kya accha ho raha hai", "Is hafte ke 2 goals", "Roz 10 minute ghar par" (3-4 concrete play activities using his interests, no screens), "Shadow teacher ke liye" (whether to stay or move to the next step and exactly what to change), "Kab expert se milein". If data is thin, say so and give a starter plan. Use "- " bullets. No diagnosis.`;
    try{let out='';await SAMPLE(prompt,{modelTier:'default',cache:false,onText:({text})=>{out=text;ao.innerHTML=md(out)}});ao.innerHTML=md(out)}
    catch(e){ao.innerHTML=`<p class="muted">${e&&e.code==='not_granted'?'AI ki permission nahi mili. Page ke Permissions menu se allow kar sakte hain.':e&&e.code==='rate_limited'?'Abhi bahut requests ho gayi. Thodi der baad try karein.':'Plan nahi ban paaya. Thodi der baad try karein.'}</p>`}
    $('#ab').disabled=false;
  };
}
function md(t){const L=esc(t).split('\n');let h='',ul=false;for(const l of L){const s=l.trim();if(/^[-*] /.test(s)){if(!ul){h+='<ul>';ul=true}h+='<li>'+s.slice(2).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</li>';continue}if(ul){h+='</ul>';ul=false}if(/^#{1,3} /.test(s))h+='<h3>'+s.replace(/^#+ /,'')+'</h3>';else if(s)h+='<p>'+s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>'}if(ul)h+='</ul>';return h}

   ${VOICE?`<label class="f">🎤 Bol kar jawab<select id="vm"><option value="1">Haan – app sunega</option><option value="0">Nahi – sirf touch</option></select></label>

   <button class="cta" id="ss">Save karein</button></div>`;
  $('#sp').value=String(PROFILE.rate);$('#sl').value=String(PROFILE.limitMin);$('#gsp').value=PROFILE.gameSpeed||'slow';
  const showV=()=>{loadVoices();const v=pickVoice('en','f');$('#vl').textContent=v?`Awaaz: ${v.name} (${v.lang})`:'Indian English awaaz nahi mili. Android: Settings → Text-to-speech → Google → English (India) download karein.'};showV();setTimeout(showV,900);
  $('#vt1').onclick=()=>say('Hello! Which vegetable do you want today?',{g:'f',pitch:1});
  $('#vt2').onclick=()=>say('Hello beta! Welcome to my shop!',{g:'m',pitch:.82});
  $('#vt3').onclick=()=>say('Uncle, I want a chocolate, please.',KIDV());
  if(VOICE){$('#vm').value=PROFILE.voiceOff?'0':'1';$('#vr').value=PROFILE.recLang||'en-IN';
    $('#mt').onclick=()=>{if(!SR){$('#mtr').textContent='Is browser mein mic se sunna nahi chalta. Google Chrome use karein.';return}PROFILE.recLang=$('#vr').value;$('#mtr').textContent='🎤 Kuch boliye… (jaise: I want chocolate)';startRec(t=>{$('#mtr').textContent='Sun raha hoon: '+translit(t)},f=>{$('#mtr').textContent=f?'Suna: "'+translit(f.text)+'" ✓':'Kuch sunai nahi diya. Chrome mein mic Allow karein.'})}}
  $('#ss').onclick=async()=>{if(VOICE){PROFILE.voiceOff=$('#vm').value!=='1';PROFILE.recLang=$('#vr').value;}
    PROFILE={...PROFILE,name:$('#sn').value.trim()||'Shivansh',interests:$('#si').value.split(',').map(x=>x.trim()).filter(Boolean),rate:+$('#sp').value,gameSpeed:$('#gsp').value,limitMin:+$('#sl').value,targets:[$('#t0').value,$('#t1').value,$('#t2').value].map(x=>x.trim()||'Goal')};await Store.profile();toast('Save ho gaya')};
