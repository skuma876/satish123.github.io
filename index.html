<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Shivansh ka Shehar</title><meta name="theme-color" content="#2A8178">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<style>
/* Layout: one calm column; kid screens use huge tap targets, parent area is a quieter dashboard. */
:root{
  --bg:#EEF5F3; --surface:#FFFFFF; --sunk:#E2EEEB; --ink:#1D3B3A; --muted:#5A7371; --line:#CFE1DD;
  --teal:#2A8178; --teal-soft:#D5ECE8; --sun:#F2A93B; --sun-soft:#FCEBCB; --coral:#DD6A50; --coral-soft:#F8DDD5;
  --good:#2F8F4E; --red-b:#E2453C; --blue-b:#3B7BE0; --green-b:#3BA65A; --yellow-b:#E9B824;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1D1C; --surface:#172A29; --sunk:#12221F; --ink:#E5F1EE; --muted:#9BB4B0; --line:#294341;
  --teal:#56B8AD; --teal-soft:#1D3B38; --sun:#F5B651; --sun-soft:#3A3020; --coral:#EE8A72; --coral-soft:#3B2621; --good:#5CC27D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1D1C; --surface:#172A29; --sunk:#12221F; --ink:#E5F1EE; --muted:#9BB4B0; --line:#294341;
  --teal:#56B8AD; --teal-soft:#1D3B38; --sun:#F5B651; --sun-soft:#3A3020; --coral:#EE8A72; --coral-soft:#3B2621; --good:#5CC27D; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800} h2{font-size:1.55rem;font-weight:700} h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
.muted{color:var(--muted)} .small{font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:1.4rem;font-weight:800}
.starpill{display:flex;align-items:center;gap:6px;background:var(--sun-soft);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.ghost{border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.95rem;background:var(--surface)}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:1.05rem;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}

/* buttons */
.btn{background:var(--teal);color:#fff;border-radius:16px;padding:12px 20px;font-weight:700;font-size:1.08rem;font-family:var(--display)}
.btn.sun{background:var(--sun);color:#3A2600}
.btn.soft{background:var(--teal-soft);color:var(--ink)}
.btn.big{font-size:1.35rem;padding:16px 28px;border-radius:22px}
.btn:disabled{opacity:.5;cursor:default}
:root[data-theme="dark"] .btn:not(.sun):not(.soft){color:#0F1D1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sun):not(.soft){color:#0F1D1C}}

/* kid home tiles */
.hello{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:28px;padding:16px 18px}
.hello .txt{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border-radius:26px;padding:18px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;border:3px solid transparent;min-height:132px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:2.6rem;line-height:1}
.tile b{font-family:var(--display);font-size:1.3rem;font-weight:700}
.tile span{color:var(--muted);font-size:.92rem;line-height:1.3}
.tile.t1{background:var(--teal-soft)} .tile.t2{background:var(--sun-soft)} .tile.t3{background:var(--coral-soft)}
.shelf{background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stickers{display:flex;gap:8px;flex-wrap:wrap;font-size:1.9rem}
.stickers .lock{opacity:.22;filter:grayscale(1)}
.bar{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}

/* Golu speaking */
.stage{display:flex;gap:12px;align-items:flex-start}
.bubble{flex:1;min-width:0;background:var(--surface);border-radius:4px 24px 24px 24px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:1.25rem;font-weight:500}
.bubble .rep{color:var(--muted);font-size:1.05rem}
.bubble .q{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.25}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1rem;align-self:flex-start}
.model{background:var(--sun-soft);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.model b{font-family:var(--display);font-size:1.3rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.choice{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:600;font-size:1.05rem;line-height:1.25}
.choice .e{font-size:2.6rem;line-height:1}
.choice.on{border-color:var(--teal);background:var(--teal-soft)}
.choice:active{transform:scale(.97)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--teal);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--teal)}
.toggle.on{background:var(--teal);color:#fff;border-style:solid}
.parentbox{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.parentbox .lbl{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.thinking{display:flex;gap:6px;padding:8px 0}
.thinking i{width:10px;height:10px;border-radius:50%;background:var(--teal);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-6px)}}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--sunk)}
.steps i.done{background:var(--sun)}

/* games */
.arena{position:relative;height:min(62vh,460px);background:linear-gradient(var(--teal-soft),var(--surface));border-radius:26px;overflow:hidden;touch-action:manipulation}
.balloon{position:absolute;width:78px;height:96px;border-radius:50% 50% 46% 46%;display:grid;place-items:center;animation:rise linear forwards}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:var(--muted)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-120px)}}
.pop{animation:popx .25s forwards}@keyframes popx{to{transform:scale(1.5);opacity:0}}
.hud{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pad{aspect-ratio:1.2;max-width:100%;border-radius:28px;font-size:3.6rem;display:grid;place-items:center;background:var(--surface);border:4px solid var(--line);transition:transform .12s,background .12s}
.pad.lit{background:var(--sun);border-color:var(--sun);transform:scale(1.05)}
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pic{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--surface);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:2.8rem}
.pic small{font-size:.9rem;font-weight:600;color:var(--muted)}
.pic.ok{border-color:var(--good);background:var(--teal-soft)} .pic.no{border-color:var(--coral);background:var(--coral-soft)}
.feedback{font-family:var(--display);font-size:1.4rem;font-weight:700;min-height:2rem;text-align:center}

/* timer */
.ring{width:min(70vw,280px);aspect-ratio:1;max-width:100%;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.nowcard{background:var(--surface);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.nowcard .e{font-size:4.6rem;line-height:1}
.planlist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.planlist div{flex:0 0 auto;background:var(--surface);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-size:.85rem;font-weight:600;border:2px solid var(--line)}
.planlist div.d{opacity:.45;text-decoration:line-through}
.planlist div.n{border-color:var(--sun)}
.planlist div span{font-size:1.7rem}

/* celebrate */
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border-radius:30px;padding:28px 18px}
.bigstars{font-size:3rem;letter-spacing:.1em}
.story{display:flex;flex-direction:column;gap:10px}
.story p{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:1.25rem;font-weight:600;font-family:var(--display)}
.story p.cur{outline:3px solid var(--sun)}

/* parent */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:700;background:var(--surface);border:2px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.chart{overflow-x:auto} .chart svg{display:block;width:100%;min-width:320px;height:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:10px 0;border-radius:12px;border:2px solid var(--line);font-weight:700;background:var(--surface)}
.scale button.on{background:var(--sun);border-color:var(--sun);color:#3A2600}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
.advice{font-size:1rem;line-height:1.6;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.advice ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tip{border-left:4px solid var(--teal);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px}
.tip b{font-family:var(--display);font-size:1.08rem}
.note{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9}
.loglist{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.loglist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
/* virtual town */
.hero{background:var(--teal);color:#fff;border-radius:28px;padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.hero b{font-family:var(--display);font-size:1.6rem;font-weight:800;display:block;line-height:1.1}
.hero span{opacity:.9}
.hero .ic{font-size:3rem}
.townmap{border-radius:26px;overflow:hidden;background:#BFE3B4}
.townmap svg{display:block;width:100%;height:auto}
.townmap .bld{cursor:pointer}
.townmap .bld:hover rect.b,.townmap .bld:focus rect.b{stroke:#F2A93B;stroke-width:5}
.townmap .bld:focus{outline:none}
.scene{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;background:#DDEFF7}
.scene>svg.bgd{position:absolute;inset:0;width:100%;height:100%}
.actors{position:absolute;left:0;right:0;bottom:0;height:82%;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4%}
.actor{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.actor svg{height:92%;width:auto;max-width:100%}
.actor.kid svg{height:68%}
.actor .tag{font-family:var(--display);font-weight:700;font-size:.85rem;background:rgba(255,255,255,.92);color:#1D3B3A;border-radius:99px;padding:0 10px;margin-top:-6px;white-space:nowrap}
.actor .act{position:absolute;top:6%;font-size:.85rem;background:rgba(255,255,255,.9);color:#1D3B3A;border-radius:10px;padding:2px 8px;font-style:italic}
.chr .m-talk{display:none}
.chr.talking .m-idle{display:none}
.chr.talking .m-talk{display:block;animation:talk .18s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.chr .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.speech{background:var(--surface);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:3px solid var(--line)}
.speech .who{font-family:var(--display);font-weight:800;color:var(--teal);font-size:1.05rem}
.speech .line{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.25}
.coach{display:flex;gap:10px;align-items:center;background:var(--sun-soft);border-radius:18px;padding:10px 12px}
.coach .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.coach .txt b{font-family:var(--display);font-size:1.15rem}
.beats{display:flex;gap:8px;flex-wrap:wrap}
.beat{flex:1 1 120px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-weight:600;line-height:1.2}
.beat span{font-size:2rem}
.beat.done{border-color:var(--good);background:var(--teal-soft)}
.mission{background:var(--surface);border:3px dashed var(--sun);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mission ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.skillrow{display:grid;grid-template-columns:minmax(0,9rem) 1fr 2.5rem;gap:10px;align-items:center;font-size:.92rem}
.skillrow .bar i{background:var(--teal)}
.placegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.agents{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.agents span{border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted);background:var(--surface)}
.agents span.on{border-color:var(--teal);color:var(--teal);font-weight:700}
.chr .body{animation:breathe 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:100px 350px}
@keyframes breathe{50%{transform:scaleY(1.008) translateY(-1px)}}
.chr.talking .head{animation:bob2 .5s ease-in-out infinite alternate;transform-box:view-box}
@keyframes bob2{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg) translateY(-1px)}}
.chr .g-wave{animation:wave .45s ease-in-out infinite alternate;transform-box:view-box}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
svg.talking{animation:bob2 .5s ease-in-out infinite alternate}
.touchhint{text-align:center;font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--teal);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.counter{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:16px 12px 20px;border-radius:22px;background:linear-gradient(#C8915A,#A06B3B);box-shadow:inset 0 -8px 0 #7E5028}
.obj{width:96px;max-width:calc(33% - 8px);aspect-ratio:1;border-radius:20px;background:#FFF8EC;color:#3A2600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.95rem;box-shadow:0 4px 0 #7E5028;transition:transform .15s}
.obj span{font-size:2.8rem;line-height:1}
.obj:active,.obj.picked{transform:translateY(-10px) scale(1.12);box-shadow:0 10px 0 #7E5028;background:#FFE3A3}
.repeat{background:var(--surface);border:3px solid var(--sun);border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.repeat .bigobj{font-size:4rem;line-height:1;animation:pulse 1.4s ease-in-out infinite}
.repeat .rlbl{font-weight:800;letter-spacing:.08em;color:var(--muted);font-size:.85rem}
.repeat .ms{font-family:var(--display);font-size:1.7rem;line-height:1.25}
.repeat mark{background:var(--sun-soft);color:inherit;border-radius:8px;padding:0 6px;box-shadow:inset 0 -4px 0 var(--sun)}
.voicelist{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
@media (max-width:420px){h1{font-size:1.7rem}.tile{min-height:118px}.tile .ic{font-size:2.2rem}.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* ---- Shivansh ka Shehar: phone-first ---- */
html,body{overscroll-behavior:none}
body{padding-block:8px 24px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
button:active{transform:scale(.96)}
.wrap{gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:4px}
.top h2{font-size:1.2rem;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{min-width:48px;min-height:44px;justify-content:center;font-size:1.3rem}
.me{display:flex;justify-content:center}
.me svg{height:100%;width:auto}
/* home */
.homehead{display:flex;align-items:flex-end;gap:12px;background:linear-gradient(160deg,var(--sun-soft),var(--teal-soft));border-radius:30px;padding:14px 14px 0;position:relative;overflow:hidden}
.homehead .me{flex:0 0 auto;margin-bottom:-6px}
.hh-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:16px}
.hh-txt h1{font-size:2.1rem;line-height:1}
.hh-txt .starpill{align-self:flex-start}
.gear{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--surface);font-size:1.3rem;display:grid;place-items:center}
.hero{position:relative;padding:12px 16px;overflow:hidden;min-height:96px}
.hero .hchar{height:96px;flex:0 0 auto;margin:-12px 0 -16px -6px}
.hero .hchar svg{height:118px;width:auto}
h3.sec{font-size:1.2rem;margin-top:2px}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.places{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{background:var(--surface);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-align:left;border:2px solid var(--line)}
.pthumb{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.pthumb>svg{position:absolute;inset:0;width:100%;height:100%}
.pchar{position:absolute;right:4%;bottom:-6%;height:98%}
.pchar svg{height:100%;width:auto}
.pcard b{font-family:var(--display);font-size:1.02rem;padding:8px 10px 0}
.pcard span{color:var(--muted);font-size:.85rem;padding:0 10px 10px}
/* scene */
.sc{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 40px)}
.steps i.now{background:var(--teal);opacity:.5}
.scene.live{aspect-ratio:4/3;border-radius:26px;box-shadow:0 6px 0 var(--line)}
@media (min-width:640px){.scene.live{aspect-ratio:16/10}}
.scene.live .actors{height:80%}
.bub{position:absolute;z-index:3;top:3%;max-width:50%;background:#FFFFFF;color:#1D3B3A;border-radius:18px;padding:8px 12px;font-family:var(--display);font-weight:700;font-size:clamp(.9rem,3.6vw,1.2rem);line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .2s}
.bub b{display:block;font-size:.72em;color:#2A8178;letter-spacing:.02em}
.bub.cb{right:3%;border-bottom-right-radius:4px}
.bub.kb{left:3%;border-bottom-left-radius:4px;background:#FFF4D6}
.bub.kb b{color:#B26B00}
.bub.on{transform:scale(1.04);box-shadow:0 0 0 3px #F2A93B}
.tray{display:flex;flex-direction:column;gap:10px;flex:1}
.ask{text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--teal);margin:0}
.cards{display:flex;flex-direction:column;gap:10px}
.acard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 14px;font-weight:700;font-size:1.12rem;line-height:1.25;min-height:64px;box-shadow:0 4px 0 var(--line);transition:transform .12s,opacity .3s}
.acard span{font-size:2.2rem;flex:0 0 auto}
.acard.tap{border-color:var(--sun);background:var(--sun-soft)}
.acard.gone{opacity:.25;filter:grayscale(1);box-shadow:none}
.counter{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:14px 10px 18px;border-radius:22px;background:linear-gradient(#C8915A,#A06B3B);box-shadow:inset 0 -8px 0 #7E5028}
.obj{width:88px;max-width:calc(33% - 8px);aspect-ratio:1;border-radius:18px;background:#FFF8EC;color:#3A2600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.9rem;box-shadow:0 4px 0 #7E5028;transition:transform .15s}
.obj span{font-size:2.6rem;line-height:1}
.obj.picked{transform:translateY(-10px) scale(1.12);background:#FFE3A3}
.repeat{background:var(--surface);border:3px solid var(--sun);border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.repeat .rlbl{font-weight:800;letter-spacing:.08em;color:var(--muted);font-size:.8rem}
.repeat .ms{font-family:var(--display);font-size:1.5rem;line-height:1.25}
.repeat mark{background:var(--sun-soft);color:inherit;border-radius:8px;padding:0 6px;box-shadow:inset 0 -4px 0 var(--sun)}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.waiting{display:flex;gap:8px;justify-content:center;padding:18px}
.waiting span{width:12px;height:12px;border-radius:50%;background:var(--teal);opacity:.5;animation:bob 1s infinite}
.waiting span:nth-child(2){animation-delay:.15s}.waiting span:nth-child(3){animation-delay:.3s}
.micbtn{align-self:center;border:2px dashed var(--coral);color:var(--coral);border-radius:999px;padding:10px 18px;font-weight:800;background:var(--surface)}
.kidsay{display:flex;gap:10px;align-items:center;align-self:center;max-width:100%;background:var(--coral-soft);border-radius:999px;padding:8px 16px 8px 8px;font-weight:700;outline:3px solid var(--coral)}
.kidsay span:last-child{min-width:0;overflow-wrap:anywhere}
.micdot{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--coral);flex:0 0 auto;animation:pulse 1s ease-in-out infinite}
.flyer{position:absolute;font-size:3rem;z-index:4;top:40%;pointer-events:none}
.flyer.tokid{animation:tokid .9s ease-in-out forwards}
.flyer.tochar{animation:tochar .9s ease-in-out forwards}
@keyframes tokid{from{left:66%;transform:scale(.6)}50%{top:18%;transform:scale(1.3)}to{left:20%;top:52%;transform:scale(1)}}
@keyframes tochar{from{left:22%;transform:scale(.6)}50%{top:18%;transform:scale(1.3)}to{left:66%;top:52%;transform:scale(1)}}
.burst{position:absolute;left:50%;top:30%;font-size:4rem;z-index:5;animation:burst .65s ease-out forwards;pointer-events:none}
@keyframes burst{from{transform:translate(-50%,0) scale(.3);opacity:1}to{transform:translate(-50%,-60px) scale(1.8);opacity:0}}
.celebrate{padding:18px}
/* games */
.gameicon{font-size:5rem;text-align:center}
.sea{background:linear-gradient(#BFE6F7,#3FA3B8)}
.fishy{position:absolute;left:-90px;background:none;padding:0}
@keyframes swimR{from{left:-90px}to{left:110%}}
@keyframes swimL{from{left:110%}to{left:-90px}}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card2{aspect-ratio:3/4;max-width:100%;border-radius:16px;background:var(--teal);display:grid;place-items:center;font-size:2.4rem}
.card2 span{visibility:hidden}
.card2.up{background:var(--surface);border:3px solid var(--line)}
.card2.up span{visibility:visible}
.card2.ok{border-color:var(--good);background:var(--teal-soft)}
.rocketlane{position:relative;height:200px;border-radius:24px;background:linear-gradient(#0E1B3D,#3B5BA8);overflow:hidden}
.rocketlane .rk{position:absolute;left:50%;transform:translateX(-50%);font-size:3rem;transition:bottom .8s cubic-bezier(.3,1.4,.5,1)}
.rocketlane .moon{position:absolute;top:8px;right:16px;font-size:2.4rem}
.countbox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--surface);border-radius:24px;padding:18px;font-size:2.8rem}
.stage .me{flex:0 0 auto}

/* ---- v3: map, levels, story, report card ---- */
.splash{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:radial-gradient(circle at 50% 35%,var(--sun-soft),var(--bg) 70%);border-radius:30px}
.splash h1{font-size:2.3rem}
.btn.go{font-size:1.6rem;padding:18px 34px;border-radius:999px;box-shadow:0 6px 0 #B9781A;animation:pulse 1.6s ease-in-out infinite}
.homehead{padding:10px 14px 0}
.homehead .me{height:120px!important}
.map{position:relative;width:100%;max-width:100%;aspect-ratio:360/780;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--line)}
.mapbg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;background:none;padding:0;width:92px}
.node .ne{width:66px;height:66px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;font-size:2.1rem;box-shadow:0 4px 0 #8AA58A;border:4px solid #FFFFFF}
.node.done .ne{border-color:#F2A93B;background:#FFF4D6}
.node.next .ne{border-color:#F2A93B;animation:pulse 1.4s ease-in-out infinite;box-shadow:0 0 0 6px rgba(242,169,59,.35),0 4px 0 #8AA58A}
.node .nn{margin-top:3px;background:rgba(255,255,255,.95);color:#1D3B3A;font-family:var(--display);font-weight:800;font-size:.8rem;line-height:1.1;border-radius:99px;padding:2px 8px;white-space:nowrap}
.node .ns{color:#E39B21;font-size:.85rem;letter-spacing:1px;text-shadow:0 1px 0 #fff}
.node .goal{position:absolute;top:-10px;right:-2px;background:#E2453C;color:#fff;font-size:.65rem;font-weight:800;border-radius:99px;padding:1px 6px}
.pin{position:absolute;width:56px;height:96px;transform:translate(-115%,-78%);pointer-events:none;animation:hop 1.2s ease-in-out infinite}
.pin svg{width:100%;height:100%}
@keyframes hop{50%{transform:translate(-115%,-84%)}}
.gamerow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.gtile{flex:0 0 132px;scroll-snap-align:start;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.gtile .ic{font-size:2.2rem}
.gtile b{font-family:var(--display);font-size:1.02rem}
.gtile span:last-child{font-size:.8rem;color:var(--muted)}
.repcard{display:flex;justify-content:space-between;align-items:center;background:var(--sun-soft);border-radius:18px;padding:10px 14px;font-size:1.4rem}
.repcard b{font-family:var(--display);font-size:1.05rem}
/* bottom sheet */
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:92dvh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%)}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.sheet h2{font-size:1.5rem}
.pthumb.big{border-radius:22px;aspect-ratio:16/10;position:relative;overflow:hidden}
.pthumb.big>svg{position:absolute;inset:0;width:100%;height:100%}
.pthumb .pme{position:absolute;left:6%;bottom:-4%;height:74%}
.pthumb .pme svg{height:100%;width:auto}
.btn.play{font-size:1.4rem;padding:16px;border-radius:20px;box-shadow:0 5px 0 #B9781A}
.lvrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.85rem;gap:2px}
.lv span{font-size:1.5rem}
.lv.ok{border-color:var(--good);background:var(--teal-soft)}
.lv.cur{border-color:var(--sun)}
/* hints */
.acard.glow,.obj.glow{border-color:#F2A93B!important;box-shadow:0 0 0 5px rgba(242,169,59,.45),0 4px 0 var(--line);animation:pulse 1.1s ease-in-out infinite}
.acard:disabled:not(.gone),.obj:disabled{opacity:1}
.unlock{font-family:var(--display);font-weight:800;color:var(--teal);font-size:1.15rem}
/* story */
.story{display:flex;flex-direction:column;gap:12px}
.stemoji{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:3.4rem;background:rgba(255,255,255,.9);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.stline{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.25;text-align:center;background:var(--surface);border-radius:22px;padding:16px;margin:0}
/* parent */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto}
.rtrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.rtrow>span{font-weight:600}
.faces{display:flex;gap:8px}
.faces button{flex:1;font-size:1.8rem;padding:6px 0;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.faces button.on{border-color:var(--sun);background:var(--sun-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:.8rem}
.week div{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:10px;padding:6px 2px}
.week span{font-size:.75rem;letter-spacing:-2px}
.stage2{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px}
.stage2 b{font-family:var(--display);font-size:1.02rem}
.stage2 span{color:var(--muted);font-size:.92rem}
.stage2.on{border-color:var(--sun);background:var(--sun-soft)}
.stage2.past{border-color:var(--good)}
.stage2.past b::after{content:" ✓";color:var(--good)}
.rs{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--teal);padding:4px 0 4px 12px}
.rs b{font-family:var(--display);font-size:1.05rem}
.rs .inapp{font-size:.92rem;background:var(--teal-soft);border-radius:10px;padding:6px 10px}
.rs a{color:var(--teal);font-weight:700;font-size:.88rem}
.skillrow{grid-template-columns:minmax(0,9.5rem) 1fr 2rem}

/* ---- Jaadui Kamra ---- */
.hero.magic{background:linear-gradient(135deg,#5E35B1,#1E88E5);color:#fff;min-height:84px}
.hero.magic .cube{font-size:2.8rem;animation:spin3 4s ease-in-out infinite;display:inline-block}
@keyframes spin3{50%{transform:rotate(12deg) scale(1.08)}}
.hero .go3{margin-left:auto;font-size:1.6rem;background:rgba(255,255,255,.2);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:0 0 auto}
.mstart{display:flex;align-items:flex-end;gap:12px;background:linear-gradient(160deg,#EDE7F6,var(--teal-soft));border-radius:26px;padding:12px 14px 0;overflow:hidden}
.mstart .me{margin-bottom:-6px;flex:0 0 auto}
.mtxt{padding-bottom:14px;min-width:0}
.domrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dom{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.dom span{font-size:1.4rem}.dom b{font-size:.72rem}.dom i{font-style:normal;color:var(--sun);font-size:.6rem;letter-spacing:1px}
.aibox{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:10px 12px}
.aibox summary{font-weight:700;cursor:pointer}
.m3{display:flex;flex-direction:column;gap:8px}
.mbub{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:6px 10px;border:2px solid var(--line);min-height:64px}
.mav{width:46px;height:64px;flex:0 0 auto}.mav svg{width:100%;height:100%}
.mline{flex:1;min-width:0;display:flex;flex-direction:column}
.mline b{font-size:.75rem;color:var(--teal)}
.mline span{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2}
.stage3{position:relative;width:100%;height:min(62vh,560px);border-radius:24px;overflow:hidden;background:#FFF3E0;box-shadow:0 6px 0 var(--line)}
.c3d{display:block;width:100%;height:100%;touch-action:none}
.m3char{position:absolute;top:6px;right:4px;width:30%;height:44%;display:none;align-items:flex-end;justify-content:center;pointer-events:none;border-radius:20px;transition:background .2s}
.m3char.on{display:flex}
.m3char svg{height:100%;width:auto}
.m3char .hand{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:1.8rem}
.m3char.hint{background:rgba(242,169,59,.28);animation:pulse 1.1s ease-in-out infinite}
.m3char.over{background:rgba(67,160,71,.35)}
.mload{position:absolute;inset:0;display:grid;place-items:center}
.m3dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.m3dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.m3dots i.done{background:#F2A93B}.m3dots i.now{background:#2A8178}
.mtray:empty{display:none}

/* ---- listening ---- */
.listen{display:flex;gap:10px;align-items:center;align-self:center;max-width:100%;background:var(--coral-soft);border-radius:999px;padding:8px 18px 8px 8px;font-weight:800;font-size:1.1rem;outline:3px solid var(--coral)}
.listen span:last-child{min-width:0;overflow-wrap:anywhere}
.micbtn{align-self:center;border:3px solid var(--coral);color:var(--coral);border-radius:999px;padding:10px 22px;font-weight:800;font-size:1.1rem;background:var(--surface)}
.micdot{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--coral);flex:0 0 auto;animation:pulse 1s ease-in-out infinite;font-size:1.2rem}
#mheard{align-self:stretch;border-radius:18px;outline:none}
#mheard.on{outline:3px solid var(--coral)}
body.listening .bub.kb{box-shadow:0 0 0 3px #DD6A50}

/* ---- games v5 ---- */
.gk{display:flex;flex-direction:column;gap:8px}
.gkhead{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:4px 10px;min-height:66px}
.gkav{width:44px;height:66px;flex:0 0 auto}.gkav svg{width:100%;height:100%}
.gkbub{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2}
.gkbar{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}.gkbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .4s}
.gkarena{position:relative;height:min(58vh,520px);border-radius:24px;overflow:hidden;background:var(--surface);border:2px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none}
.gkarena.sky{background:linear-gradient(#9FD8F7,#E3F4FD)}
.gkarena.pond{background:linear-gradient(#7FD3E8,#2E8FB0)}
.gkarena.cards,.gkarena.pads{height:auto;min-height:300px;padding:12px;background:var(--surface);overflow:visible}
.gkfoot{display:flex;align-items:center;gap:10px;min-height:72px}
.gkme{width:48px;height:76px;flex:0 0 auto}.gkme svg{width:100%;height:100%}
.gkfb{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--teal)}
.gkfb.pop{animation:fbpop .4s ease-out}@keyframes fbpop{from{transform:scale(1.25)}}
.cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.85}.cloud::before{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:#fff;left:22px;top:-26px}
.cloud.c1{left:6%;top:12%}.cloud.c2{right:4%;top:40%;transform:scale(.8)}
.gkballoon{position:absolute;left:0;top:0;width:96px;height:144px;padding:0;background:none;border:0;will-change:transform}
.gkballoon svg{width:100%;height:100%;pointer-events:none}
.gkballoon.popped{transform-origin:center;opacity:0;transition:opacity .2s}
.gkballoon.fly{transition:transform .6s ease-in,opacity .6s;opacity:0}
.gkfish{position:absolute;left:0;top:0;width:120px;height:72px;padding:0;background:none;border:0;will-change:transform}
.gkfish svg{width:100%;height:100%;pointer-events:none}
.gkfish.catch{transition:transform .45s ease-in}
.bucket{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:3rem;display:flex;align-items:center;gap:4px}
.bucket span{font-family:var(--display);font-weight:800;font-size:1.4rem;background:#fff;border-radius:99px;padding:0 10px;color:#1D3B3A}
.weed{position:absolute;bottom:0;width:18px;height:90px;background:#2E7D32;border-radius:18px 18px 0 0;opacity:.6}.weed.w1{left:8%}.weed.w2{right:10%;height:70px}
.gkbanner{position:absolute;inset:auto 8% 40% 8%;background:rgba(255,255,255,.95);border-radius:22px;padding:16px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.7rem;color:#1D3B3A;box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:6;animation:fbpop .4s}
.gkbit{position:absolute;width:12px;height:12px;border-radius:3px;pointer-events:none;animation:bit .6s ease-out forwards}@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.gkstar{position:absolute;font-size:2.2rem;pointer-events:none;transform:translate(-50%,-50%);animation:starup .9s ease-out forwards;z-index:7}@keyframes starup{to{transform:translate(-50%,-180px) scale(1.4);opacity:0}}
.gkstop{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;max-width:560px;margin:0 auto;background:#FFF5F0;border:4px solid #E2453C;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h b" "h p" "g g";column-gap:14px;row-gap:4px;align-items:center;padding:14px 16px;animation:up .25s ease-out}
.gkstop .hand{grid-area:h;font-size:2.8rem;background:#E2453C;border-radius:50%;width:78px;height:78px;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(226,69,60,.22);animation:pulse 1s ease-in-out infinite}
.gkstop b{grid-area:b;font-family:var(--display);font-size:2rem;color:#C62828;line-height:1}
.gkstop p{grid-area:p;font-family:var(--display);font-weight:700;font-size:1.2rem;color:#1D3B3A;margin:0;line-height:1.25}
.gkstop .btn{grid-area:g;margin-top:6px}
.gkwrong{animation:shakeit .5s ease-in-out 2!important;filter:grayscale(.3);outline:5px solid #E2453C;outline-offset:2px;border-radius:18px;z-index:11;position:relative}
@keyframes shakeit{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
const FEM=/heera|swara|lekha|veena|kalpana|neerja|aarohi|ananya|kavya|shruti|aditi|raveena|kajal|female|google हिन्दी|google hindi|isha|sangeeta|pallavi/i;
const MALE=/ravi|madhur|rishi|hemant|prabhat|kunal|aarav|arjun|male|prakash|vikram/i;
const isIN=v=>/[-_]IN$/i.test(v.lang)||/india|hindi|हिन्दी/i.test(v.name);
function pickVoice(lang,g){
  const pool=VOICES.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.slice(0,2))&&(lang==='hi'||isIN(v)));
  if(!pool.length)return null;
  const sc=v=>(/natural|online|neural|enhanced|premium/i.test(v.name)?4:0)+(g==='f'&&FEM.test(v.name)?3:0)+(g==='m'&&MALE.test(v.name)?3:0)+(g==='f'&&MALE.test(v.name)?-3:0)+(g==='m'&&FEM.test(v.name)&&!/google/i.test(v.name)?-3:0)+(v.localService===false?1:0);
  return pool.slice().sort((a,b)=>sc(b)-sc(a))[0];
}
function say(text,o={}){
  if(!('speechSynthesis' in window)||!(text||o.deva))return Promise.resolve();
  return new Promise(res=>{try{
    speechSynthesis.cancel();
    const mode=PROFILE.voice||'auto',g=o.g||'f';
    let v=null,t=text;
    if(mode!=='en-IN'){v=pickVoice('hi',g);const dv=o.deva||(typeof toDeva==='function'?toDeva(text):null);if(dv&&(v||!VOICES.length))t=dv;if(!v&&!VOICES.length){v={lang:'hi-IN',_fake:1}}}
    if(!v&&mode==='hi-IN')v=pickVoice('hi',g);
    if(!v)v=pickVoice('en',g)||pickVoice('hi',g);
    const u=new SpeechSynthesisUtterance(String(t).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').replace(/\(([^)]*)\)/g,''));
    if(v&&!v._fake){u.voice=v;u.lang=v.lang}else u.lang=v?'hi-IN':'en-IN';
    u.rate=(PROFILE.rate||0.9)*(o.rate||1);u.pitch=o.pitch||1.1;
    if(o.onb)u.onboundary=o.onb;
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,Math.min(16000,2500+String(t).length*95));
  }catch(e){res()}});
}

let AC=null;
function cue(k){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const tone=(f,st,d,type='sine',v=.14)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t+st);g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(v,t+st+.01);g.gain.exponentialRampToValueAtTime(.001,t+st+d);o.connect(g).connect(AC.destination);o.start(t+st);o.stop(t+st+d+.05);return o};
  const S={shop:()=>{tone(1318,0,.9);tone(1760,.12,1.1)},
    park:()=>[0,.22,.5,1.1,1.32].forEach(st=>{const o=tone(2500,st,.12,'sine',.07);o.frequency.exponentialRampToValueAtTime(3600,t+st+.1)}),
    school:()=>[0,.35,.7].forEach(st=>tone(880,st,.3,'triangle',.12)),
    market:()=>{tone(523,0,.15,'triangle',.1);tone(659,.15,.15,'triangle',.1);tone(784,.3,.35,'triangle',.1)},
    clinic:()=>tone(1046,0,.7),party:()=>[523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.25,'square',.04)),
    road:()=>{tone(420,0,.18,'square',.06);tone(420,.26,.26,'square',.06)},
    restaurant:()=>{tone(2093,0,.4,'sine',.07);tone(2637,.08,.45,'sine',.05)},home:()=>{tone(784,0,.5);tone(659,.38,.8)},
    pop:()=>{const o=tone(500,0,.16,'sine',.16);o.frequency.exponentialRampToValueAtTime(1300,t+.14)},
    yay:()=>[523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.32,'triangle',.1))};
  (S[k]||S.pop)();
}catch(e){}}

const SR=(typeof VOICE!=='undefined'&&VOICE)?(window.SpeechRecognition||window.webkitSpeechRecognition||null):null;

const micOK=()=>!!(SR&&PROFILE.mic!==false);
function stopRec(){if(REC){const r=REC,f=r._fin;REC=null;try{r.onend=null;r.onresult=null;r.abort()}catch(e){}f&&f(true)}document.body.classList.remove('listening')}
function startRec(onInterim,onFinal,ms=7000){
  stopRec();let r;try{r=new SR()}catch(e){onFinal(null);return}
  REC=r;r.lang=PROFILE.recLang||'hi-IN';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  let text='',alts=[],ended=false;const to=setTimeout(()=>{try{r.stop()}catch(e){}},ms);
  document.body.classList.add('listening');
  r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)alts=Array.from(e.results[i]).map(a=>a.transcript)}text=t;onInterim&&onInterim(t)};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){PROFILE.mic=false;try{Store.profile()}catch(x){}toast('Mic ki permission nahi mili. Touch se khelte hain.')}};
  r._fin=(aborted)=>{if(ended)return;ended=true;clearTimeout(to);if(REC===r)REC=null;document.body.classList.remove('listening');onFinal(!aborted&&text?{text,alts:alts.length?alts:[text]}:null)};
  r.onend=()=>r._fin(false);
  try{r.start()}catch(e){ended=true;clearTimeout(to);document.body.classList.remove('listening');onFinal(null)}
}

const stripNukta=s=>String(s).normalize('NFD').replace(/़/g,'').normalize('NFC');

function devaRev(){if(DEVA_REV)return DEVA_REV;DEVA_REV={};Object.entries(DEVA_W).forEach(([r,d])=>{d.split(' ').length===1&&(DEVA_REV[stripNukta(d)]=DEVA_REV[stripNukta(d)]||r)});DEVA_REV[stripNukta(PROFILE.nameDeva||'शिवांश')]=kidName().toLowerCase();return DEVA_REV}
const DV2={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'n','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'n','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'f','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l'};

function translit(s){
  const rev=devaRev();
  return stripNukta(s).split(/(\s+)/).map(w=>{if(!/[ऀ-ॿ]/.test(w))return w;const k=w.replace(/[।?!.,]/g,'');if(rev[k])return rev[k];
    let o='';for(let i=0;i<w.length;i++){const c=w[i],n=w[i+1];if(DV2[c]!==undefined){o+=DV2[c];if(n!==undefined&&/[ऀ-ॿ]/.test(n)&&DVM2[n]===undefined)o+='a'}else if(DVV2[c]!==undefined)o+=DVV2[c];else if(DVM2[c]!==undefined)o+=DVM2[c];else o+=c}return o}).join('');
}
const norm=s=>' '+translit(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/oo/g,'u').replace(/ee/g,'i').replace(/(.)\1+/g,'$1').replace(/w/g,'v').replace(/ph/g,'f').replace(/z/g,'j').replace(/\s+/g,' ').trim()+' ';
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const skel=w=>w.replace(/ch/g,'C').replace(/c/g,'k').replace(/C/g,'ch').replace(/q/g,'k').replace(/[aeiouy]/g,'').replace(/(.)\1+/g,'$1');
function hasKey(heard,key){
  const H=norm(heard),K=norm(fillN(key)).trim();if(!K)return false;
  if(H.includes(' '+K+' ')||(K.length>3&&H.includes(K)))return true;
  if(K.includes(' '))return K.split(' ').every(k=>hasKey(heard,k));
  const words=H.trim().split(' '),ks=skel(K);
  if(ks.length>=2&&words.some(w=>{const s=skel(w);return s===ks||(ks.length>=3&&lev(s,ks)<=1)}))return true;
  const tol=K.length>=7?2:K.length>=4?1:0;return tol>0&&words.some(w=>lev(w,K)<=tol);
}
const anyKey=(h,keys)=>(h.alts||[h.text]).some(t=>keys.some(k=>hasKey(t,k)));
function keyScore(h,keys){let b=0;(h.alts||[h.text]).forEach(t=>{const n=keys.filter(k=>hasKey(t,k)).length/keys.length;if(n>b)b=n});return b}

function apiSample(){
  if(!PROFILE.apiKey)return null;
  const call=async(prompt,max=900,tier)=>{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':PROFILE.apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:tier==='quick'?'claude-haiku-5-5':'claude-sonnet-5-5',max_tokens:max,messages:[{role:'user',content:prompt}]})});if(!r.ok)throw {code:r.status===429?'rate_limited':'error'};const j=await r.json();return (j.content||[]).map(c=>c.text||'').join('')};
  const f=async(prompt,o={})=>{const t=await call(prompt,1500,o.modelTier);o.onText&&o.onText({text:t});return {text:t}};
  f.json=async(prompt,o={})=>{const t=await call(prompt+'\nReply with JSON only.',3000,o.modelTier);const m=t.match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)};
  return f;
}
async function aiReply(system,user){
  const S=SAMPLE;if(!S)return null;
  try{const ctl=new Promise((_,rej)=>setTimeout(()=>rej('t'),8000));ctl.catch(()=>{});const r=await Promise.race([S(`${system}\n\n${user}\n\nReply with the line only.`,{modelTier:'quick',cache:false}),ctl]);return String(r.text||'').trim().replace(/^"|"$/g,'').split('\n')[0]||null}catch(e){return null}
}

  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const my=(y0+y1)/2;d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}
  const done=MAP_ORDER.filter(k=>lvOf(k)>=2).length;
  const tree=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="0" width="6" height="14" fill="#8D6E63"/><circle cx="0" cy="-6" r="14" fill="#4CAF50"/><circle cx="-8" cy="0" r="9" fill="#43A047"/><circle cx="8" cy="-1" r="9" fill="#66BB6A"/></g>`;
  const house=(x,y,c)=>`<g transform="translate(${x} ${y})"><rect x="-14" y="-10" width="28" height="22" rx="2" fill="${c}"/><path d="M-18 -10 L0 -26 L18 -10Z" fill="#B23A48"/><rect x="-4" y="2" width="8" height="10" fill="#5D4037"/></g>`;
  return `<svg class="mapbg" viewBox="0 0 360 780" preserveAspectRatio="none" aria-hidden="true">
   <rect width="360" height="780" fill="#BFE3B4"/>
   <path d="M0 300 Q90 270 180 310 T360 290 L360 330 Q270 350 180 340 T0 335Z" fill="#7EC8E3" opacity=".8"/>
   <circle cx="320" cy="40" r="26" fill="#F7D046"/>
   ${tree(30,120)}${tree(330,180,.9)}${tree(20,420,1.1)}${tree(340,520)}${tree(60,690,.9)}${tree(320,740)}${tree(190,560,.8)}${tree(180,140,.8)}
   ${house(330,420,'#F4C27A')}${house(40,560,'#9FC5E8')}${house(320,620,'#F8B4C4')}
   <path d="${d}" fill="none" stroke="#C9B48A" stroke-width="30" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="#E8D9B5" stroke-width="22" stroke-linecap="round"/>

   <rect x="10" y="12" width="118" height="26" rx="13" fill="#FFFFFF" opacity=".9"/><text x="69" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#2E5E3A" font-family="Baloo 2,sans-serif">🏁 ${done}/9 jagah poori</text></svg>`;

/* ---- place sheet: one big Play button that picks the right level ---- */
const LEVELS=[null,['👀','Dekho','Pehle dekho, Shivansh kaise bolta hai'],['🤝','Saath mein','Chamakte card ki madad se'],['⭐','Khud se','Bina madad ke']];
function closeSheet(){const s=$('#sheet');if(s)s.remove()}
function placeSheet(k){
  closeSheet();const P=PLACE_DATA[k],C=getChar(P.char),lv=lvOf(k),nl=Math.min(lv+1,3),ai=(AISC[k]||[]).length;
  const el=document.createElement('div');el.id='sheet';el.className='sheetwrap';
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(P.n)}"><div class="grab"></div>
   <div class="pthumb big">${backdrop(P.bg)}<div class="pchar">${charSVG(C,'happy','wave')}</div><div class="pme">${charSVG(kidLook(),'happy','idle')}</div></div>
   <h2>${P.e} ${T(P.n)}</h2><p class="muted">${esc(C.n)} wahan milenge</p>
   <button class="btn big sun play" data-lv="${nl}">${LEVELS[nl][0]} ${LEVELS[nl][1]} ▶</button>
   <div class="lvrow">${[1,2,3].map(i=>`<button class="lv ${i<=lv?'ok':''} ${i===nl?'cur':''}" data-lv="${i}"><span>${LEVELS[i][0]}</span>${LEVELS[i][1]}${i<=lv?' ✓':''}</button>`).join('')}</div>
   <div class="row"><button class="btn soft" id="story">📖 Aaj wahan ja rahe ho? Kahani dekho</button>${SAMPLE?`<button class="btn soft" id="newsc">✨ Naya scene${ai?` (${ai})`:''}</button>`:''}</div>
   <button class="ghost" id="cls">Band karo</button></div>`;
  document.body.appendChild(el);
  el.onclick=e=>{if(e.target===el)closeSheet()};
  el.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{closeSheet();go('scene',k,+b.dataset.lv)});
  $('#story').onclick=()=>{closeSheet();go('story',k)};
  $('#cls').onclick=closeSheet;
  const n=$('#newsc');if(n)n.onclick=()=>{closeSheet();go('aiscene',k)};
  say(T(P.n)+'! Chalo!',NARR);
}

/* ================= SCENE ENGINE — Shivansh is the hero ================= */
const alive=id=>SC&&SC.id===id&&(current==='scene'||current==='chat');
SCREENS.scene=(k,level,steps)=>{
  const P=PLACE_DATA[k];level=level||Math.min(lvOf(k)+1,3);
  SC={id:++SCID,k,P,steps:steps||P.steps,level,charId:P.char,step:0,stars:0,res:[],said:0,phase:'char',line:'',kidLine:'',gesture:'wave',emo:'happy',kidG:'idle',kidEmo:'happy',opts:null,objs:null,item:'',model:'',showModel:level<3,fly:null,burst:false,resolve:null,talking:null,hint:false};
  renderScene();cue(P.bg);runScene(SC.id);
};
function stageHTML(){
  const C=getChar(SC.charId),K=kidLook(),bg=SC.P?SC.P.bg:'park';
  return `<div class="scene live">${backdrop(bg)}
    ${SC.line?`<div class="bub cb${SC.talking==='char'?' on':''}"><b>${esc(C.n)}</b>${esc(T(SC.line))}</div>`:''}
    ${SC.kidLine?`<div class="bub kb${SC.talking==='kid'?' on':''}"><b>${esc(K.n)}</b>${esc(T(SC.kidLine))}</div>`:''}
    <div class="actors"><div class="actor kid" data-kid>${charSVG(K,SC.kidEmo,SC.kidG)}<span class="tag">${esc(K.n)}</span></div>
    <div class="actor ${C.kid?'kid':''}" data-cid="${SC.charId}">${charSVG(C,SC.emo,SC.gesture)}<span class="tag">${esc(C.n)}</span></div></div>
    ${SC.fly?`<span class="flyer ${SC.fly.dir}">${SC.fly.e}</span>`:''}${SC.burst?`<span class="burst">⭐</span>`:''}</div>`;
}
function trayHTML(){return listenHTML()+trayHTML0()}
function trayHTML0(){
  const watch=SC.level===1;
  if(SC.phase==='pick'&&SC.opts)return `<p class="ask">${watch?'👀 Dekho, Shivansh kya chunta hai…':micOK()?'🗣️ Bolo, ya card dabao':`👆 ${esc(kidName())} kya bolega?`}</p><div class="cards">${SC.opts.map((o,i)=>`<button class="acard${o.gone?' gone':''}${SC.hint&&o[2]&&!o.gone?' glow':''}" data-ai="${i}" ${o.gone||watch?'disabled':''}><span>${o[0]}</span>${esc(T(fillN(o[1])))}</button>`).join('')}</div>`;
  if(SC.phase==='choose'&&SC.objs)return `<p class="ask">${watch?'👀 Dekho…':micOK()?'🗣️ Naam bolo, ya touch karo':'👆 Touch karke batao!'}</p><div class="counter">${SC.objs.map((o,i)=>`<button class="obj${SC.hintObj===i?' glow':''}" data-oi="${i}" ${watch?'disabled':''}><span>${o[0]}</span>${esc(T(o[1]))}</button>`).join('')}</div>`;
  if(SC.phase==='repeat')return `<div class="repeat"><span class="rlbl">AB TUM BHI ZOR SE BOLO 🗣️</span>${SC.showModel?`<b class="ms">${hl(T(SC.model),T(SC.item))}</b>`:`<button class="ghost" id="peek">💡 Yaad nahi? Dekho</button>`}
    <div class="rbtns">${SC.showModel?`<button class="btn soft" id="rs">🔊 Suno</button>`:''}<button class="btn big sun" id="rd">🗣️ Maine bola!</button></div><button class="ghost" id="rn">Aage →</button></div>`;
  if(SC.phase==='watchdone')return `<div class="repeat"><span class="rlbl">DEKH LIYA!</span><b class="ms">Ab tumhari baari!</b><button class="btn big sun" id="mine">🤝 Ab main karunga ▶</button></div>`;
  return `<div class="waiting"><span></span><span></span><span></span></div>`;
}
function renderScene(){
  if(!SC||current!=='scene')return;const P=SC.P;
  app().innerHTML=`<div class="sc">${topBar(P.e+' '+T(P.n),`<span class="starpill">${LEVELS[SC.level][0]} ⭐ ${SC.stars}</span>`)}
  <div class="steps">${SC.steps.map((_,i)=>`<i class="${i<SC.step?'done':i===SC.step?'now':''}"></i>`).join('')}</div>
  ${stageHTML()}<div class="tray">${trayHTML()}</div></div>`;
  bindTray();
}
function bindTray(){
  app().querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{b.classList.add('tap');SC.resolve&&SC.resolve({type:'opt',opt:SC.opts[+b.dataset.ai]})});
  app().querySelectorAll('[data-oi]').forEach(b=>b.onclick=()=>{b.classList.add('picked');SC.resolve&&SC.resolve({type:'obj',obj:SC.objs[+b.dataset.oi]})});
  const q=s=>app().querySelector(s);
  if(q('#rd'))q('#rd').onclick=()=>SC.resolve&&SC.resolve({type:'said'});
  if(q('#rn'))q('#rn').onclick=()=>SC.resolve&&SC.resolve({type:'skip'});
  if(q('#rs'))q('#rs').onclick=()=>kidSays(SC.id,SC.model,true);
  if(q('#peek'))q('#peek').onclick=()=>{SC.showModel=true;SC.peeked=true;renderScene();kidSays(SC.id,SC.model,true)};
  if(q('#mine'))q('#mine').onclick=()=>go('scene',SC.k,2,SC.steps);
  if(q('#mic'))q('#mic').onclick=()=>listenNow(SC.id);
}
function refreshStage(){if(current==='scene'){const s=app().querySelector('.scene');if(s)s.outerHTML=stageHTML()}else if(current==='chat')renderChat()}
function hl(t,w){const e=esc(t);if(!w)return e;const i=e.toLowerCase().indexOf(esc(w).toLowerCase());return i<0?e:e.slice(0,i)+'<mark>'+e.slice(i,i+esc(w).length)+'</mark>'+e.slice(i+esc(w).length)}
async function charSays(id,line,gesture,emo){
  if(!alive(id))return;SC.line=fillN(line);SC.gesture=gesture||SC.gesture;SC.emo=emo||'happy';SC.talking='char';refreshStage();
  const el=app().querySelector(`[data-cid="${SC.charId}"] .chr`);if(el)el.classList.add('talking');
  const C=getChar(SC.charId);await say(SC.line,{...(C.v||{}),g:C.g||'f'});
  if(!alive(id))return;SC.talking=null;const e2=app().querySelector(`[data-cid="${SC.charId}"] .chr`);if(e2)e2.classList.remove('talking');const b=app().querySelector('.bub.cb');if(b)b.classList.remove('on');
}
async function kidSays(id,text,quiet){
  if(!alive(id))return;if(!quiet){SC.kidLine=text;SC.talking='kid';SC.kidG='idle';refreshStage()}
  const el=app().querySelector('[data-kid] .chr');if(el)el.classList.add('talking');
  await say(text,KIDV());
  if(!alive(id))return;if(!quiet)SC.talking=null;const e2=app().querySelector('[data-kid] .chr');if(e2)e2.classList.remove('talking');const b=app().querySelector('.bub.kb');if(b)b.classList.remove('on');
}
/* time-delay prompting: in "Saath mein" the right card starts glowing if he waits */
function waitInput(id){return new Promise(res=>{
  SC.resolve=v=>{SC.resolve=null;res(v)};SC.hint=false;SC.hintObj=null;current==='scene'?renderScene():renderChat();
  if(SC.level===2&&(SC.phase==='pick'||SC.phase==='choose'))TIMERS.push(setTimeout(()=>{if(alive(id)&&SC.resolve&&(SC.phase==='pick'||SC.phase==='choose')){SC.hint=true;if(SC.phase==='choose')SC.hintObj=Math.floor(Math.random()*SC.objs.length);renderScene()}},3500));
})}
async function burst(id){if(!alive(id))return;SC.burst=true;SC.stars++;cue('yay');refreshStage();await sleep(650);if(alive(id))SC.burst=false}
async function fly(id,e,dir){if(!alive(id))return;SC.fly={e,dir};refreshStage();await sleep(900);if(alive(id)){SC.fly=null;if(dir==='tokid')SC.kidG='give';refreshStage()}}
async function huh(id,st,n){
  const again='Hmm... '+String(st.line).replace(/,?\s*\{name\}\s*/g,' ').replace(/\s+/g,' ').trim();
  await charSays(id,n>1?again:(st.huh||'Haha, mazedaar! Par pehle mera sawaal suno.'),'think',n>1?'neutral':'surprised');
}
async function doSay(id,st){
  SC.opts=shuffle(st.opts.map(o=>Object.assign([...o],{gone:false})));SC.phase='pick';
  let wrong=0;
  while(alive(id)){
    let opt;
    if(SC.level===1){renderScene();await sleep(1200);if(!alive(id))return 0;SC.hint=true;renderScene();await sleep(900);opt=SC.opts.find(o=>o[2])}
    else{const inp=await waitInput(id);if(!alive(id))return 0;if(inp.type!=='opt')continue;opt=inp.opt}
    const text=fillN(opt[1]);SC.phase='talk';
    await kidSays(id,text);if(!alive(id))return 0;
    if(opt[2]){
      await burst(id);SC.kidEmo='happy';
      await charSays(id,st.ok,st.gesture2||'clap','happy');
      if(st.action)await fly(id,st.action==='coin'?'🪙':'🎁',st.action==='coin'?'tochar':'tokid');
      if(SC.level===1)return 2;
      const r=await repeatIt(id,text.replace(/\([^)]*\)\s*/g,'').trim());
      return wrong?1:(r?2:1);
    }
    wrong++;SC.kidEmo='neutral';
    await huh(id,st,wrong);if(!alive(id))return 0;
    opt.gone=true;SC.phase='pick';SC.kidEmo='happy';if(SC.level===3)SC.hint=true;
  }
  return 0;
}
async function doChoose(id,st){
  SC.objs=st.objs;SC.phase='choose';
  let obj;
  if(SC.level===1){renderScene();await sleep(1300);if(!alive(id))return 0;SC.hintObj=Math.floor(Math.random()*st.objs.length);renderScene();await sleep(900);obj=st.objs[SC.hintObj]}
  else{let inp;do{inp=await waitInput(id);if(!alive(id))return 0}while(inp.type!=='obj');obj=inp.obj}
  SC.item=obj[1];SC.objs=null;SC.phase='talk';
  const sentence=st.model.replace(/\{item\}/g,obj[1]);setDevaFor(sentence,st.model,obj[1]);
  const react=st.react.replace(/\{item\}/g,obj[1]);setDevaFor(react,st.react,obj[1]);
  await kidSays(id,sentence);
  await fly(id,obj[0],'tokid');
  await burst(id);
  await charSays(id,react,'give','happy');
  if(SC.level===1)return 2;
  const r=await repeatIt(id,sentence);
  return r?2:1;
}
async function repeatIt(id,sentence){
  if(!alive(id))return false;
  SC.model=sentence;SC.phase='repeat';SC.showModel=SC.level<3;SC.peeked=false;
  if(SC.level<3)TIMERS.push(setTimeout(()=>alive(id)&&SC.phase==='repeat'&&kidSays(id,sentence,true),500));
  const inp=await waitInput(id);if(!alive(id))return false;
  SC.phase='talk';SC.model='';
  if(inp.type==='said'){SC.said++;await burst(id);await say(pick(['Wah! Zor se bola!','Superb!','Very good!','Shabaash!']),NARR);return !SC.peeked||SC.level<3}
  return false;
}
async function runScene(id){
  await sleep(450);
  for(SC.step=0;SC.step<SC.steps.length;SC.step++){
    if(!alive(id))return;
    const st=SC.steps[SC.step];SC.model='';SC.item='';SC.kidLine='';SC.opts=null;SC.objs=null;SC.kidG='idle';SC.kidEmo='happy';SC.phase='char';SC.hint=false;SC.hintObj=null;renderScene();
    await charSays(id,st.line,st.gesture||'idle');
    if(!alive(id))return;
    SC.res.push(st.t==='choose'?await doChoose(id,st):await doSay(id,st));
    await sleep(350);
  }
  if(alive(id))endScene(id);
}
function endScene(id){
  const P=SC.P,k=SC.k,sum=SC.res.reduce((a,b)=>a+b,0),stars=Math.max(1,Math.round(3*sum/(SC.steps.length*2)));
  const pr=PROG.places[k]||(PROG.places[k]={lv:0,plays:0});pr.plays++;
  const passed=SC.level===1||stars>=2;
  if(passed&&SC.level>pr.lv)pr.lv=SC.level;
  Store.prog();logAct('scene',stars+SC.stars,{place:k,name:P.n,level:SC.level,res:SC.res,said:SC.said,steps:SC.steps.length,ai:!!SC.ai});
  if(SC.level===1){SC.phase='watchdone';SC.line='';SC.kidLine='';renderScene();say('Dekh liya! Ab tumhari baari!',NARR);return}
  SC.gesture='wave';SC.kidG='wave';SC.line='Bye bye! Phir aana, okay?';SC.kidLine='Bye bye!';SC.phase='end';
  const up=passed&&SC.level===pr.lv&&SC.level<3?`<p class="unlock">Agla level khul gaya: ${LEVELS[SC.level+1][0]} ${LEVELS[SC.level+1][1]}!</p>`:'';
  app().innerHTML=`<div class="sc">${topBar(P.e+' '+T(P.n))}${stageHTML()}
  <div class="celebrate"><div class="bigstars">${'⭐'.repeat(stars)}</div><h1>Shabaash!</h1><p>${SC.said} baar khud zor se bola!</p>${up}</div>
  <div class="mission"><h3>🌟 Asli ${esc(T(P.n))} mein ye karna hai</h3><ol>${P.real.map(s=>`<li>${esc(T(s))}</li>`).join('')}</ol><p class="muted small"><b>Mummy/Papa:</b> wahan use pehle bolne dijiye, 5 second wait kariye.</p></div>
  <div class="row"><button class="btn big sun" id="again">🔁 Phir se</button><button class="btn big soft" onclick="go('home')">🗺️ Naksha</button></div></div>`;
  $('#again').onclick=()=>go('scene',k,Math.min(lvOf(k)+1,3),SC.ai?SC.steps:null);
  cue('yay');say('Shabaash! Bahut accha kiya!',NARR);
}

SCREENS.story=(k)=>{
  const P=PLACE_DATA[k],C=getChar(P.char);
  const pages=[{t:`Aaj hum ${P.n} jaayenge.`,e:P.e,g:'idle'},{t:`Wahan ${C.n} honge.`,e:'👋',g:'wave'}];
  P.steps.forEach(st=>{if(st.t==='choose')pages.push({t:'Main bolunga: '+st.model.replace('{item}',st.objs[0][1]),e:st.objs[0][0],g:'point'});else{const b=st.opts.find(o=>o[2]);pages.push({t:'Main bolunga: '+fillN(b[1]).replace(/\([^)]*\)\s*/g,''),e:b[0],g:'idle'})}});
  pages.push({t:'Agar mujhe wait karna pade, main aaram se wait karunga.',e:'⏳',g:'think'},{t:'Sab khush honge. Mujhe star milega!',e:'⭐',g:'clap'});
  let i=0;
  const draw=()=>{const p=pages[i];
    app().innerHTML=`${topBar('📖 '+T(P.n)+' ki Kahani')}<div class="steps">${pages.map((_,j)=>`<i class="${j<i?'done':j===i?'now':''}"></i>`).join('')}</div>
    <div class="story"><div class="pthumb big">${backdrop(P.bg)}<div class="pchar">${charSVG(C,'happy',i===1?'wave':'idle')}</div><div class="pme">${charSVG(kidLook(),'happy',p.g)}</div><span class="stemoji">${p.e}</span></div>
    <p class="stline">${esc(T(p.t))}</p></div>
    <div class="row" style="justify-content:space-between"><button class="btn soft" id="pv" ${i?'':'disabled'}>← Peeche</button><button class="btn soft" id="rp">🔊</button><button class="btn big sun" id="nx">${i<pages.length-1?'Aage →':'Ho gaya! ✓'}</button></div>`;
    say(p.t,KIDV());
    $('#pv').onclick=()=>{if(i){i--;draw()}};$('#rp').onclick=()=>say(p.t,KIDV());
    $('#nx').onclick=()=>{if(i<pages.length-1){i++;draw()}else{logAct('story',1,{place:k});go('scene',k,Math.max(2,Math.min(lvOf(k)+1,3)))}};
  };draw();
};

const shortOf=t=>translit(String(t)).trim().split(/\s+/).slice(0,4).join(' ');

async function doSay(id,st){
  SC.opts=shuffle(st.opts.map(o=>Object.assign([...o],{gone:false})));SC.phase='pick';SC.keepHint=false;
  const right=SC.opts.find(o=>o[2]),rightText=fillN(right[1]).replace(/\([^)]*\)\s*/g,'').trim();

    let opt=null,text='',spoken=false,good=false;
    if(SC.level===1){renderScene();await sleep(1200);if(!alive(id))return 0;SC.hint=true;renderScene();await sleep(900);opt=right;text=fillN(opt[1]);good=true}
    else{
      const inp=await waitInput(id,{listen:tries<6});if(!alive(id))return 0;
      if(inp.type==='opt'){opt=inp.opt;text=fillN(opt[1]);good=!!opt[2]}

async function doChoose(id,st){

const FULL_PRAISE=['Wah! Poora sentence bola!','Superb! Zor se aur saaf bola!','Very good! Bilkul aise hi bolte hain!','Shabaash! Kitna accha bola!'];
async function repeatIt(id,sentence){
  if(!alive(id))return false;
  SC.model=sentence;SC.phase='repeat';SC.showModel=SC.level<3;SC.peeked=false;
  if(SC.level<3||micOK()){refreshTray();await kidSays(id,sentence,true)}
  const keys=contentWords(sentence);let tries=0;
  while(alive(id)){
    SC.phase='repeat';
    const inp=await waitInput(id,{listen:tries<4});if(!alive(id))return false;
    if(inp.type==='skip'){SC.phase='talk';SC.model='';return false}
    if(inp.type==='said'){SC.said++;SC.phase='talk';SC.model='';await burst(id);await say(pick(FULL_PRAISE),NARR);return !SC.peeked||SC.level<3}
    if(inp.type==='speech'){
      SC.said++;await heardBubble(id,inp.text);
      const sc=keyScore(inp,keys.length?keys:[sentence]);
      if(sc>=.5){SC.phase='talk';SC.model='';await burst(id);await say(sc>=.85?pick(FULL_PRAISE):'Wah! Bahut accha bola!',NARR);return true}
      tries++;SC.showModel=true;await say(tries===1?'Accha try! Ek baar aur, mere saath bolo:':'Dhyaan se suno, phir bolo:',NARR);await kidSays(id,sentence,true);continue}
    if(inp.type==='silence'){tries++;if(tries<=3){SC.showModel=true;await say(pick(['Ab tumhari baari! Zor se bolo:','Bolo na, main sun raha hoon:']),NARR);await kidSays(id,sentence,true)}}
  }
  return false;
}

/* =====================================================================
   DHYAAN GAMES v5 — slow, big touch targets, and "Ruko!" on a wrong action.
   Every wrong tap pauses the game, shows what was wrong and what was right,
   explains in a calm voice, then the game continues from the same place.
   ===================================================================== */
const gSpeed=()=>PROFILE.gameSpeed==='normal'?1:.7;
const gState=k=>{PROG.games=PROG.games||{};return PROG.games[k]||(PROG.games[k]={lv:1,best:0,plays:0})};
const tapOn=(el,fn)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn(e)},{passive:false})};
const rectIn=(el,host)=>{const a=el.getBoundingClientRect(),b=host.getBoundingClientRect();return {x:a.left-b.left+a.width/2,y:a.top-b.top+a.height/2}};
const BCOL={laal:'#E53935',neela:'#1E88E5',hara:'#43A047',peela:'#FDD835',narangi:'#FB8C00',gulabi:'#EC407A'};
const fem=c=>adj(c,'f');

function gameKit(key,title,guide,arenaCls){
  stopTimers();
  app().innerHTML=`<div class="gk">${topBar(title,`<span class="starpill" id="gks">⭐ 0</span>`)}
   <div class="gkhead"><div class="gkav" id="gkav">${charSVG(getChar(guide),'happy','idle')}</div><div class="gkbub" id="gkt">…</div><button class="say" id="gkr" aria-label="Phir se suno">🔊</button></div>
   <div class="gkbar"><i id="gkp"></i></div>
   <div class="gkarena ${arenaCls||''}" id="gka"></div>
   <div class="gkfoot"><div class="gkme" id="gkme">${charSVG(kidLook(),'happy','idle')}</div><div class="gkfb" id="gkfb"></div></div></div>`;
  const C=getChar(guide);
  const G={key,stars:0,stops:0,paused:false,ended:false,line:'',ar:$('#gka')};window.__G=G;
  G.alive=()=>current===key&&!G.ended&&document.body.contains(G.ar);
  G.say=async(t)=>{if(!G.alive())return;G.line=t;const b=$('#gkt');if(b)b.textContent=T(t);const a=$('#gkav .chr');a&&a.classList.add('talking');await say(t,{...(C.v||{}),g:C.g||'f'});const a2=$('#gkav .chr');a2&&a2.classList.remove('talking')};
  $('#gkr').onclick=()=>G.say(G.line);
  G.progress=f=>{const p=$('#gkp');if(p)p.style.width=Math.max(0,Math.min(100,f*100))+'%'};
  G.me=(emo,g)=>{const m=$('#gkme');if(m)m.innerHTML=charSVG(kidLook(),emo,g||'idle')};
  G.fb=t=>{const f=$('#gkfb');if(f){f.textContent=T(t);f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop')}};
  G.streak=0;
  G.good=(el,msg)=>{G.stars++;G.streak++;const s=$('#gks');if(s)s.textContent='⭐ '+G.stars;sfx('pop');buzz(18);G.me('happy','clap');
    if(el&&G.ar.contains(el)){const p=rectIn(el,G.ar),st=document.createElement('span');st.className='gkstar';st.textContent='⭐';st.style.left=p.x+'px';st.style.top=p.y+'px';G.ar.appendChild(st);setTimeout(()=>st.remove(),900)}
    const m=msg||(G.streak%3===0?pick(['Wah! Teen ek saath!','Kamaal! Aise hi!','Super dhyaan!']):pick(['Shabaash!','Sahi!','Badhiya!','Haan!']));G.fb(m);if(G.streak%3===0||msg)say(m,NARR);
    setTimeout(()=>G.alive()&&G.me('happy','idle'),900)};
  G.stop=async(msg,o={})=>{
    if(!G.alive())return;G.paused=true;G.stops++;G.streak=0;try{navigator.vibrate&&navigator.vibrate([70,50,70])}catch(e){}sfx('knock');
    const w=[].concat(o.wrong||[]).filter(Boolean),r=[].concat(o.right||[]).filter(Boolean);
    w.forEach(e=>e.classList.add('gkwrong'));r.forEach(e=>e.classList.add('gkright'));G.me('sad','idle');
    const ov=document.createElement('div');ov.className='gkstop';ov.innerHTML=`<div class="hand">✋</div><b>Ruko!</b><p>${esc(T(msg))}</p><button class="btn big sun" id="gkgo">▶ Theek hai</button>`;G.ar.appendChild(ov);
    let done=false;const fin=()=>{if(done)return;done=true;ov.remove();w.forEach(e=>e.classList.remove('gkwrong'));r.forEach(e=>e.classList.remove('gkright'));G.me('happy','idle');G.paused=false};
    tapOn(ov.querySelector('#gkgo'),fin);
    await G.say('Ruko! '+msg);if(!done)await new Promise(res=>{const t=setTimeout(res,1600);TIMERS.push(t);const chk=setInterval(()=>{if(done||!G.alive()){clearInterval(chk);res()}},100);TIMERS.push(chk)});
    fin();
  };
  G.loop=(update)=>{let last=performance.now();const f=now=>{if(!G.alive())return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!G.paused)update(dt);requestAnimationFrame(f)};requestAnimationFrame(f)};
  G.finish=(msg,data={})=>{if(G.ended)return;G.ended=true;const s=gState(key);s.plays++;const stars=G.stops<=1?3:G.stops<=3?2:1;if(G.stops<=2&&s.lv<3){s.lv++;toast(`Agla level khul gaya: Level ${s.lv}!`)}s.best=Math.max(s.best,G.stars);Store.prog();logAct(key,stars,{...data,stops:G.stops,lv:s.lv});
    setTimeout(()=>{if(current===key)celebrate(stars,msg,key)},700)};
  return G;
}

const PICS5=[['🍎','seb'],['🚗','car'],['⚽','ball'],['🐶','kutta'],['🌞','suraj'],['🏠','ghar'],['🐟','machhli'],['✏️','pencil'],['🍌','kela'],['🚂','train'],['🌳','ped'],['🐱','billi'],['⭐','taara'],['🎈','gubbara'],['📚','kitaab']];

    G.ar.innerHTML=`<div class="g6">${set.map(([e,n])=>`<button class="pic5" data-n="${n}"><span>${e}</span><small>${T(n)}</small></button>`).join('')}</div><div class="ears">👂 Dhyaan se suno…</div>`;
    const btns=[...G.ar.querySelectorAll('.pic5')];btns.forEach(b=>b.disabled=true);

    const e=G.ar.querySelector('.ears');if(e)e.textContent='👆 Ab touch karo';btns.forEach(b=>b.disabled=false);

      const hintT=setTimeout(()=>{const b=btns.find(x=>x.dataset.n===tg[pos][1]);b&&b.classList.add('gkright')},9000/gSpeed());TIMERS.push(hintT);
      btns.forEach(b=>tapOn(b,async()=>{if(G.paused||b.classList.contains('ok'))return;
        if(b.dataset.n===tg[pos][1]){b.classList.add('ok');b.classList.remove('gkright');sfx('pop');buzz(15);pos++;if(pos===tg.length){clearTimeout(hintT);res()}}
        else{wrongHere=true;const right=btns.find(x=>x.dataset.n===tg[pos][1]);await G.stop(`Ye ${b.dataset.n} hai. Suno: ${text}`,{wrong:b,right})}}))});

function lastDays(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}return o}
let PT='report';
SCREENS.parent=()=>{
  app().innerHTML=`${topBar('Mummy/Papa','<span></span>')}
  <div class="tabs">${[['report','📋 Report card'],['progress','📈 Progress'],['shadow','🏫 Shadow plan'],['advice','✨ AI salah'],['research','🔬 Research'],['settings','⚙️ Setup']].map(([k,n])=>`<button class="${PT===k?'on':''}" data-pt="${k}">${n}</button>`).join('')}</div><div id="pv"></div>`;
  app().querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PT=b.dataset.pt;SCREENS.parent()});

/* Daily report card (Fabiano et al. 2025): specific targets, daily feedback, small home reward */

  $('#pv').innerHTML=`<div class="card"><div class="spread"><h3>Aaj ka Report Card</h3><span class="muted small">${d}</span></div>
   <p class="muted small">Shaam ko 1 minute: school / shadow teacher se poochh kar har goal par chehra chunein. 😀 = 2 ⭐, 🙂 = 1 ⭐. Raat ko ek chhota inaam (kahani, park, sticker) do.</p>
   ${PROFILE.targets.map((t,i)=>`<div class="rtrow"><span>${esc(t)}</span><div class="faces" data-i="${i}">${['😐','🙂','😀'].map((f,v)=>`<button class="${r[i]===v?'on':''}" data-v="${v}" aria-label="${v}">${f}</button>`).join('')}</div></div>`).join('')}

  <div class="card"><h3>Pichhle 7 din</h3><div class="week">${lastDays(7).map(x=>{const v=(PROG.reports||{})[x];return `<div><b>${x.slice(8)}</b><span>${v?v.map(n=>['😐','🙂','😀'][n]).join(''):'·'}</span></div>`}).join('')}</div>

  $('#rsave').onclick=async()=>{const had=!!(PROG.reports||{})[d];PROG.reports={...(PROG.reports||{}),[d]:r};await Store.prog();if(!had)await logAct('report',r.reduce((a,b)=>a+b,0),{r});toast('Report card save ho gaya');pReport()};
}
function pProgress(){

  const said=inR.reduce((s,l)=>s+((l.d||{}).said||0),0),gn=inR.filter(l=>l.act==='gonogo');
  const acc=gn.length?Math.round(gn.reduce((s,l)=>s+(l.d.acc||0),0)/gn.length):null;
  const perDay=days.map(d=>inR.filter(l=>l.day===d).reduce((s,l)=>s+l.stars,0)),mx=Math.max(1,...perDay);
  $('#pv').innerHTML=`<div class="card"><h3>Pichhle 14 din</h3><div class="kpis"><div class="kpi"><b>${new Set(inR.map(l=>l.day)).size}/14</b><span>din khela</span></div><div class="kpi"><b>${said}</b><span>sentence khud zor se bole</span></div><div class="kpi"><b>${MAP_ORDER.filter(k=>lvOf(k)>=2).length}/9</b><span>jagah "Saath mein" tak</span></div><div class="kpi"><b>${acc==null?'–':acc+'%'}</b><span>Laal Gubbare (rukne ki kshamta)</span></div></div>
   <div class="chart"><svg viewBox="0 0 640 150">${perDay.map((v,i)=>`<rect x="${i*45+12}" y="${120-v/mx*100}" width="28" height="${v/mx*100}" rx="4" fill="var(--sun)"/><text x="${i*45+26}" y="140" text-anchor="middle" font-size="11" fill="var(--muted)">${+days[i].slice(8)}</text>`).join('')}</svg></div><p class="muted small">Roz ke stars</p></div>
  <div class="card"><h3>5 skills (Jaadui Kamra)</h3><p class="muted small">Level 1–5. Coach har skill ka level khud badhata/ghataata hai taaki ${esc(kidName())} zyada-tar khud sahi kar sake.</p>${Object.keys(DOMS).map(k=>{const d=domState(k);return `<div class="skillrow"><span>${DOMS[k][0]} ${DOMS[k][1]}</span><div class="bar"><i style="width:${d.lv/5*100}%"></i></div><b>${d.lv}</b></div>`}).join('')}</div>
  <div class="card"><h3>Shehar ka naksha</h3>${MAP_ORDER.map(k=>{const P=PLACE_DATA[k],lv=lvOf(k);return `<div class="skillrow"><span>${P.e} ${esc(P.n)}</span><div class="bar"><i style="width:${lv/3*100}%"></i></div><b>${['–','👀','🤝','⭐'][lv]}</b></div>`}).join('')}</div>
  <div class="card"><h3>Haal ki activities</h3><div class="loglist">${LOGS.slice(0,20).map(l=>`<div><span>${l.day.slice(5)} · ${ACTN[l.act]||l.act}${l.d&&l.d.name?' · '+esc(l.d.name):''}${l.d&&l.d.level?' '+LEVELS[l.d.level][0]:''}</span><span class="muted">${l.d&&l.d.said!=null?l.d.said+' bola · ':''}${'⭐'.repeat(Math.min(3,l.stars))}</span></div>`).join('')||'<p class="muted">Abhi kuch nahi.</p>'}</div></div>`;
}
